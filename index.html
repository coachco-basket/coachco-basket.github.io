<style>
/* Layout : appli téléphone, une colonne centrée (560px max), barre d'onglets fixe en bas */
:root{
  --bg:#12151D;--bg2:#161A23;--card:#1A1E28;--line:#282F3E;--line2:#3A4252;--fg:#F4F6F8;--mut:#A9B1BD;
  --cy:#22D3EE;--cy-ink:#052A31;--cy-t:#0B3340;--cy-f:#67E8F9;--cy-c:#142430;--cy-b:#1F3A47;
  --go:#FFC93C;--go-ink:#2E2205;--go-t:#3A2E0A;--go-f:#FFD966;--go-c:#2A2410;--go-b:#4A3E14;
  --vi:#C4B5FD;--vi-ink:#1E1440;--vi-t:#2A2150;--vi-c:#1E1A3A;--vi-b:#3A3070;
  --gr:#86EFAC;--gr-ink:#0B2A17;--gr-t:#12351F;--gr-c:#14281D;--gr-b:#1F4430;
  --bl:#93C5FD;--bl-t:#142A4A;--ne-t:#1F2532;--ne-f:#E2E6EC;--red-t:#3A1E15;--red:#FF9A76;
  --go-grad:linear-gradient(135deg,#FFF3C4 0%,#FFD54F 22%,#E8A914 48%,#FFE38A 70%,#C68A0A 100%);
  /* une couleur par technique, partout dans l'appli */
  --pa:#6EA8FF;--pa-t:#152547;--pa-c:#131C30;--pa-b:#243A66;
  --dr:#B794FF;--dr-t:#2A1F4D;--dr-c:#1C1735;--dr-b:#3A2E6B;
  --ti:#F07CE4;--ti-t:#3B1736;--ti-c:#261326;--ti-b:#55214E;
  --de:#FF6B81;--de-t:#3D1622;--de-c:#28141A;--de-b:#5A2232;
  --du:#D6DBE3;--du-t:#2A2F38;--du-c:#1E222A;--du-b:#3D4450;
  --ec:#C5F26F;--ec-t:#2A3512;--ec-c:#1B2311;--ec-b:#3A4A1A;
  --at:#E2AC7E;--at-t:#3A2616;--at-c:#261B12;--at-b:#55392A;
  --ma:#5EEAD4;--ma-t:#0E3A35;--ma-c:#102824;--ma-b:#1E4E47;
  --hero:#0D2A35;--hero-b:#1F5D6E;--wood:#D2A46B;--ink:#1B1D21;
  --ff:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--fd:'Space Grotesk','Inter',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--ff);-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-family:var(--ff)}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#app{min-height:100%;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.page{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.hdr{display:flex;align-items:center;gap:12px;min-height:48px}
.h1{margin:0;font:600 22px/1.2 var(--fd);text-wrap:balance}
.h2{margin:0;font:600 21px/1.25 var(--fd);text-wrap:balance}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mut{color:var(--mut)}.small{font-size:12px}.t15{font-size:15px;font-weight:600}
.ib{width:44px;height:44px;flex:none;border-radius:22px;border:0;background:var(--ne-t);color:var(--fg);display:flex;align-items:center;justify-content:center}
.btn{height:44px;border-radius:22px;padding:0 16px;border:0;font:600 15px var(--ff);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.wide{width:100%;border-radius:12px}.btn.sm{height:36px;font-size:13px;padding:0 12px;border-radius:18px}
.bp{background:var(--cy);color:var(--cy-ink)}.bg{background:var(--go-t);color:var(--go)}.bn{background:var(--ne-t);color:var(--fg)}.bd{background:var(--red-t);color:var(--red)}
.bdash{background:transparent;border:1px dashed var(--line2);color:var(--cy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.c-cy{background:var(--cy-c);border-color:var(--cy-b)}.c-go{background:var(--go-c);border-color:var(--go-b)}.c-vi{background:var(--vi-c);border-color:var(--vi-b)}.c-gr{background:var(--gr-c);border-color:var(--gr-b)}
.hero{background:var(--hero);border:1px solid var(--hero-b);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;color:inherit;font:inherit;width:100%}
.badge{font-size:11px;font-weight:600;letter-spacing:.06em;padding:4px 10px;border-radius:10px;align-self:flex-start}
.b-go{background:var(--go-grad);color:var(--go-ink)}.b-cy{background:var(--cy);color:var(--cy-ink)}.b-gr{background:var(--gr);color:var(--gr-ink)}.b-vi{background:var(--vi);color:var(--vi-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:500;padding:4px 10px;border-radius:12px;display:inline-flex;align-items:center;gap:4px;border:0;font-family:var(--ff)}
button.chip{height:32px;padding:0 12px;font-size:13px}
.chip.off{background:transparent;border:1px solid var(--line2);color:var(--mut)}
.chip.sel{outline:2px solid currentColor;outline-offset:-2px}
.t-cy{background:var(--cy-t);color:var(--cy-f)}.t-vi{background:var(--vi-t);color:var(--vi)}.t-go{background:var(--go-t);color:var(--go-f)}.t-gr{background:var(--gr-t);color:var(--gr)}.t-bl{background:var(--bl-t);color:var(--bl)}.t-ne{background:var(--ne-t);color:var(--ne-f)}
.sec{margin:6px 0 0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:18px;height:3px;border-radius:2px;background:currentColor}
.k-cy{color:var(--cy)}.k-go{color:var(--go)}.k-vi{color:var(--vi)}.k-gr{color:var(--gr)}.k-mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:12px;text-align:left;width:100%;color:inherit;font:inherit;border-radius:14px;border:1px solid var(--line);padding:10px 12px;box-sizing:border-box}
.row{background:var(--card)}
.row.c-cy,.c-cy{background:var(--cy-c);border-color:var(--cy-b)}.row.c-go,.c-go{background:var(--go-c);border-color:var(--go-b)}.row.c-vi,.c-vi{background:var(--vi-c);border-color:var(--vi-b)}.row.c-gr,.c-gr{background:var(--gr-c);border-color:var(--gr-b)}
.row.c-pa,.c-pa{background:var(--pa-c);border-color:var(--pa-b)}.row.c-dr,.c-dr{background:var(--dr-c);border-color:var(--dr-b)}.row.c-ti,.c-ti{background:var(--ti-c);border-color:var(--ti-b)}.row.c-de,.c-de{background:var(--de-c);border-color:var(--de-b)}.row.c-du,.c-du{background:var(--du-c);border-color:var(--du-b)}.row.c-ec,.c-ec{background:var(--ec-c);border-color:var(--ec-b)}.row.c-at,.c-at{background:var(--at-c);border-color:var(--at-b)}.row.c-ma,.c-ma{background:var(--ma-c);border-color:var(--ma-b)}
.t-pa{background:var(--pa-t);color:var(--pa)}.t-dr{background:var(--dr-t);color:var(--dr)}.t-ti{background:var(--ti-t);color:var(--ti)}.t-de{background:var(--de-t);color:var(--de)}.t-du{background:var(--du-t);color:var(--du)}.t-ec{background:var(--ec-t);color:var(--ec)}.t-at{background:var(--at-t);color:var(--at)}.t-ma{background:var(--ma-t);color:var(--ma)}
.d-pa,.b-pa{background:var(--pa);color:#0B1733}.d-dr,.b-dr{background:var(--dr);color:#1E1440}.d-ti,.b-ti{background:var(--ti);color:#3A0D33}.d-de,.b-de{background:var(--de);color:#3A0A14}.d-du,.b-du{background:var(--du);color:#1A1E26}.d-ec,.b-ec{background:var(--ec);color:#1E2A08}.d-at,.b-at{background:var(--at);color:#3A220E}.d-ma,.b-ma{background:var(--ma);color:#05302A}
.k-pa{color:var(--pa)}.k-dr{color:var(--dr)}.k-ti{color:var(--ti)}.k-de{color:var(--de)}.k-du{color:var(--du)}.k-ec{color:var(--ec)}.k-at{color:var(--at)}.k-ma{color:var(--ma)}
.gold{background:var(--go-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* effet brillant : un dégradé métallique construit à partir de la couleur --c */
.bp,.seg button.on,.b-cy,.d-cy,.cal .tr,.b-gr,.d-gr,.b-vi,.b-pa,.d-pa,.b-dr,.d-dr,.b-ti,.d-ti,.b-de,.d-de,.b-du,.d-du,.b-ec,.d-ec,.b-at,.d-at,.b-ma,.d-ma,.cyb,.cybar{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 45%,#fff) 0%,var(--c) 28%,color-mix(in srgb,var(--c) 86%,#000) 52%,color-mix(in srgb,var(--c) 70%,#fff) 76%,color-mix(in srgb,var(--c) 84%,#000) 100%)!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,#fff)}
.bp,.seg button.on,.b-cy,.d-cy,.cal .tr{--c:var(--cy)}.b-gr,.d-gr{--c:var(--gr)}.b-vi{--c:var(--vi)}.b-pa,.d-pa{--c:var(--pa)}.b-dr,.d-dr{--c:var(--dr)}.b-ti,.d-ti{--c:var(--ti)}.b-de,.d-de{--c:var(--de)}.b-du,.d-du{--c:var(--du)}.b-ec,.d-ec{--c:var(--ec)}.b-at,.d-at{--c:var(--at)}.b-ma,.d-ma{--c:var(--ma)}
.chip[class*="t-"],.row[class*="c-"],.card[class*="c-"],.lvl,.item,.tile{background-image:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,0) 55%)!important}
.chip[class*="t-"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
/* une couleur par cycle (--cc) */
.cyc{background:linear-gradient(155deg,color-mix(in srgb,var(--cc) 30%,#12151D) 0%,color-mix(in srgb,var(--cc) 13%,#12151D) 55%,color-mix(in srgb,var(--cc) 20%,#12151D) 100%)!important;border:1px solid color-mix(in srgb,var(--cc) 55%,#12151D)!important}
.cyc-past{filter:saturate(.55)}
.cyb,.cybar{--c:var(--cc);color:color-mix(in srgb,var(--cc) 18%,#000)!important}
.cybar-off{background:color-mix(in srgb,var(--cc) 24%,#12151D)}
.cyt{color:color-mix(in srgb,var(--cc) 50%,#fff)}
.cychip{background:color-mix(in srgb,var(--cc) 26%,#12151D);color:color-mix(in srgb,var(--cc) 55%,#fff)}
.b-go,.d-go{background:var(--go-grad)!important;color:var(--go-ink)!important;box-shadow:inset 0 0 0 1px rgba(255,240,190,.35)}
.date{width:54px;height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-weight:600;font-size:11px;letter-spacing:.04em}
.date b{font:600 20px/1 var(--fd)}
.d-cy{background:var(--cy);color:var(--cy-ink)}.d-go{background:var(--go-grad);color:var(--go-ink)}.d-gr{background:var(--gr);color:var(--gr-ink)}.d-ne{background:var(--ne-t);color:var(--ne-f)}
.lbl{font-size:11px;font-weight:600;width:52px;padding:4px 0;text-align:center;border-radius:8px;flex:none}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px}
.seg button{flex:1;height:38px;border:0;border-radius:9px;background:transparent;color:var(--mut);font:500 14px var(--ff)}
.seg button.on{background:var(--cy);color:var(--cy-ink);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font:600 22px var(--fd);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.theme{min-height:76px;border-radius:14px;border:0;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:var(--fg);font:600 15px var(--ff)}
.theme span{font-size:12px;font-weight:500}
.weeks{display:grid;gap:6px}
.bar{height:8px;border-radius:4px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.flab{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
input,textarea,select{background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:15px var(--ff);padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
textarea{min-height:64px;resize:vertical;field-sizing:content;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:2px solid var(--cy);outline-offset:0;border-color:transparent}
input:disabled,textarea:disabled{opacity:.9;color:var(--ne-f)}
.titleIn{font:600 21px/1.25 var(--fd);background:transparent;border:1px solid transparent;padding:4px 6px;margin-left:-6px}
.titleIn:hover:not(:disabled){border-color:var(--line)}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chk{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:12px;padding:10px 14px;font-weight:500}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--go)}
.thumb{width:100%;max-width:100%;display:block;border-radius:12px;aspect-ratio:10/7;height:auto}
.mini{width:84px;height:59px;border-radius:8px;flex:none;display:block}
.vtabs{display:flex;gap:6px;flex-wrap:wrap}
.vtabs button{height:36px;min-width:50px;border-radius:18px;border:1px solid var(--line2);background:transparent;color:var(--ne-f);font:600 13px var(--ff)}
.vtabs button.on{background:var(--cy);border-color:var(--cy);color:var(--cy-ink)}
.banner{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.mvb{display:flex;gap:4px;flex:none}
.grip{width:34px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--mut);touch-action:none;cursor:grab;border-radius:8px}
.grip:focus-visible{outline:2px solid var(--cy)}
.item .grip{height:36px;width:30px}
.dragging{position:relative;z-index:40;opacity:.95;box-shadow:0 12px 28px rgba(0,0,0,.55);transition:none}
.dropline{position:fixed;height:3px;border-radius:2px;background:var(--cy);box-shadow:0 0 8px var(--cy);z-index:50;pointer-events:none}
body.sorting{user-select:none;-webkit-user-select:none}
.mvb button{width:34px;height:34px;border-radius:10px;border:0;background:var(--ne-t);color:var(--ne-f);display:flex;align-items:center;justify-content:center}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:18px;text-align:center;color:var(--mut);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:13px}
.cal .h{font-size:11px;color:var(--mut);font-weight:600}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--mut);font:500 13px var(--ff);padding:0}
.cal .in{background:var(--card);color:var(--fg)}
.cal .tr{background:var(--cy);color:var(--cy-ink);font-weight:600}
.cal .cec{background:var(--go-grad);color:var(--go-ink);font-weight:600}
.cal .td{outline:2px solid var(--go-f);outline-offset:-2px}
.lvl{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:8px;border-radius:10px;padding:8px 8px 8px 12px;font-size:15px;font-weight:500}
.item span{flex:1;min-width:0}
.item button{width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:inherit;opacity:.7}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg2);border-top:1px solid #232A37;padding:8px max(4px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;justify-content:space-around;width:100%;max-width:560px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:62px;font:500 11px var(--ff);color:var(--mut);padding:0}
nav.tabs button span{height:30px;width:52px;border-radius:15px;display:flex;align-items:center;justify-content:center}
nav.tabs button.on{color:var(--cy);font-weight:600}
nav.tabs button.on span{background:var(--cy-t)}
.ovl{position:fixed;inset:0;z-index:20;background:rgba(5,7,12,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-sizing:border-box;border-top:1px solid var(--line)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line2);align-self:center}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:14px;padding:14px;border:0;color:var(--fg);font:600 15px var(--ff)}

.warn{font-size:13px;color:var(--go-f)}
.ed{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ed-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.ed-cv{flex:1;position:relative;min-height:0;margin:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;border:0;background:rgba(18,21,29,.82);color:var(--fg);font:600 20px var(--ff)}
.ed-sel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));min-height:44px;font-size:13px;color:var(--mut)}
.ed-tools{display:flex;gap:6px;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));scrollbar-width:none}
.tool{flex:none;width:62px;height:62px;border-radius:12px;border:0;background:var(--card);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 10px var(--ff)}
.tool.on{background:var(--cy-t);color:var(--cy-f);outline:2px solid var(--cy);outline-offset:-2px}
.tool.undo{background:var(--go-grad);color:var(--go-ink)}
.tsep{flex:none;width:1px;background:var(--line);margin:6px 2px}
#print{display:none}
@media print{
  #app,nav.tabs,.ovl,.ed{display:none!important}
  body{background:#fff!important;color:#111!important}
  #print{display:block;font:11pt/1.4 var(--ff);color:#111;padding:0}
  #print .ph{display:flex;align-items:center;gap:14px;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:12px}
  #print h1{font:600 20pt var(--fd);margin:0}
  #print .pb{break-inside:avoid;border:1px solid #bbb;border-radius:8px;padding:10px 12px;margin:0 0 10px}

}
const COURT_FULL=courtD(false),COURT_HALF=courtD(true);

function resample(pts,step){
  if(pts.length<2)return pts.slice();
  const out=[pts[0]];let acc=0;
  for(let i=1;i<pts.length;i++){
    let a=pts[i-1],b=pts[i];let seg=Math.hypot(b[0]-a[0],b[1]-a[1]);
    while(acc+seg>=step&&seg>0){const t=(step-acc)/seg;const p=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];out.push(p);a=p;seg=Math.hypot(b[0]-a[0],b[1]-a[1]);acc=0}
    acc+=seg;
  }
  const L=pts[pts.length-1],o=out[out.length-1];if(Math.hypot(L[0]-o[0],L[1]-o[1])>1)out.push(L);
  return out;
}
function smoothD(p){
  if(p.length<3)return `M${p[0][0]} ${p[0][1]}`+p.slice(1).map(q=>`L${q[0]} ${q[1]}`).join('');
  let d=`M${p[0][0]} ${p[0][1]}`;
  for(let i=1;i<p.length-1;i++){const m=[(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2];d+=`Q${p[i][0]} ${p[i][1]} ${m[0].toFixed(1)} ${m[1].toFixed(1)}`}
  const l=p[p.length-1];return d+`L${l[0]} ${l[1]}`;
}
function normalAt(p,i){const a=p[Math.max(0,i-1)],b=p[Math.min(p.length-1,i+1)];const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return [-dy/l,dx/l]}
function head(p,size,col){
  const b=p[p.length-1];let a=p[0];
  for(let i=p.length-2;i>=0;i--){if(Math.hypot(b[0]-p[i][0],b[1]-p[i][1])>=22){a=p[i];break}}
  const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,px=-uy,py=ux;
  const bx=b[0]-ux*size,by=b[1]-uy*size;
  return `<path d="M${b[0]} ${b[1]}L${(bx+px*size*.55).toFixed(1)} ${(by+py*size*.55).toFixed(1)}L${(bx-px*size*.55).toFixed(1)} ${(by-py*size*.55).toFixed(1)}Z" fill="${col}"/>`;
}
function trimEnd(p,len){const r=resample(p,4);let acc=0;for(let i=r.length-1;i>0;i--){acc+=Math.hypot(r[i][0]-r[i-1][0],r[i][1]-r[i-1][1]);if(acc>=len)return r.slice(0,i)}return r.slice(0,1).concat([r[r.length-1]])}
function arrowBody(el){
  const p=el.pts;if(!p||p.length<2)return '';
  if(el.type==='main')return `<path d="${smoothD(p)}" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;

  let s='';
  if(el.type==='passe')s=`<path d="${smoothD(body)}" fill="none" stroke="${INK}" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round"/>`;

}

    case 'att':return `<path d="M-14 -14L14 14M14 -14L-14 14" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`;

const isArrow=t=>['passe','depl','dribble','tir','main'].includes(t);
function elSvg(el,hit){
  if(isArrow(el.type)){
    return `<g data-id="${el.id}">${hit?`<path d="${smoothD(el.pts)}" fill="none" stroke="transparent" stroke-width="28" stroke-linecap="round" pointer-events="stroke"/>`:''}${arrowBody(el)}</g>`;
  }
  const tr=`translate(${el.x} ${el.y}) rotate(${el.rot||0}) scale(${el.s||1})`;
  let h='';
  if(hit){
    if(el.type==='terrain')h=`<path d="${COURT_FULL}" fill="none" stroke="transparent" stroke-width="22" vector-effect="non-scaling-stroke" pointer-events="stroke"/>`;
    else if(el.type==='demi')h=`<g transform="translate(-210 0)"><path d="${COURT_HALF}" fill="none" stroke="transparent" stroke-width="22" vector-effect="non-scaling-stroke" pointer-events="stroke"/></g>`;
    else h=`<circle r="${(SEL_R[el.type]||30)}" fill="transparent" pointer-events="all"/>`;
  }
  return `<g data-id="${el.id}" transform="${tr}">${h}${elBody(el)}</g>`;
}
function drawingSvg(els,cls){

}

function calendar(c,trs){
  if(!c.start||!c.end)return `<div class="empty">Ajoute les dates du cycle pour voir le calendrier.</div>`;
  const map={};trs.forEach(t=>{if(t.date)(map[t.date]=map[t.date]||[]).push(t)});
  let out='';const s=pd(c.start),e=pd(c.end);let m=new Date(s.getFullYear(),s.getMonth(),1,12);
  while(m<=e){
    const y=m.getFullYear(),mo=m.getMonth();const first=new Date(y,mo,1,12);const days=new Date(y,mo+1,0).getDate();const off=(first.getDay()+6)%7;
    out+=`<h3 class="sec k-cy">${first.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h3><div class="cal">${['L','M','M','J','V','S','D'].map(d=>`<span class="h">${d}</span>`).join('')}${'<span></span>'.repeat(off)}`;
    for(let d=1;d<=days;d++){const k=iso(new Date(y,mo,d,12));const inC=k>=c.start&&k<=c.end;const t=map[k];
      const cls=['d',inC?'in':'',t?(t[0].cec?'cec':'tr'):'',k===today()?'td':''].join(' ');
      out+=t?`<button type="button" class="${cls}" data-a="openTr" data-id="${t[0].id}" aria-label="${esc(t[0].title)}, ${fdate(k)}">${d}</button>`:`<span class="${cls}">${d}</span>`}
    out+='</div>';m=new Date(y,mo+1,1,12);
  }
  return out+`<p class="small mut" style="margin:0">Cyan : séance · Or : séance CEC. Touche un jour pour ouvrir la séance.</p>`;
}

/* ---------- réordonnancement libre (glisser-déposer) ---------- */
let DRG=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('.grip');if(!g||ED)return;
  const it=g.closest('[data-sid]'),box=it&&it.closest('[data-sort]');if(!box)return;
  e.preventDefault();try{g.setPointerCapture(e.pointerId)}catch(_){}
  const ind=document.createElement('div');ind.className='dropline';document.body.appendChild(ind);
  DRG={it,box,group:box.dataset.group,id:it.dataset.sid,y0:e.clientY,sy0:window.scrollY,pid:e.pointerId,ind,target:null,last:box};
  it.classList.add('dragging');document.body.classList.add('sorting');dragMove(e);
});
document.addEventListener('pointermove',e=>{if(DRG&&e.pointerId===DRG.pid){e.preventDefault();dragMove(e)}},{passive:false});
function dragMove(e){
  const D=DRG;if(e.clientY<90)window.scrollBy(0,-14);else if(e.clientY>innerHeight-120)window.scrollBy(0,14);
  D.it.style.transform=`translateY(${e.clientY-D.y0+(window.scrollY-D.sy0)}px)`;
  const boxes=[...document.querySelectorAll(`[data-sort][data-group="${D.group}"]`)];
  const box=boxes.find(b=>{const r=(b.closest('section')||b).getBoundingClientRect();return e.clientY>=r.top&&e.clientY<=r.bottom})||D.last;D.last=box;
  const items=[...box.children].filter(x=>x.dataset&&x.dataset.sid&&x!==D.it);
  let idx=items.length;for(let i=0;i<items.length;i++){const r=items[i].getBoundingClientRect();if(e.clientY<r.top+r.height/2){idx=i;break}}
  D.target={box,idx};
  const br=box.getBoundingClientRect();let y;
  if(idx<items.length)y=items[idx].getBoundingClientRect().top-6;else if(items.length)y=items[items.length-1].getBoundingClientRect().bottom+4;else y=br.top+br.height/2;
  Object.assign(D.ind.style,{top:y+'px',left:br.left+'px',width:br.width+'px'});
}
function dragEnd(e){if(!DRG||e.pointerId!==DRG.pid)return;const D=DRG;DRG=null;D.ind.remove();D.it.classList.remove('dragging');D.it.style.transform='';document.body.classList.remove('sorting');if(D.target)applySort(D.group,D.id,D.target.box,D.target.idx)}
document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd);
document.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('.grip');if(!g||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;e.preventDefault();const it=g.closest('[data-sid]'),box=it.closest('[data-sort]');const sib=[...box.children].filter(x=>x.dataset&&x.dataset.sid);const i=sib.indexOf(it);const j=e.key==='ArrowUp'?i-1:i+1;if(j<0||j>=sib.length)return;applySort(box.dataset.group,it.dataset.sid,box,j);const ng=document.querySelector(`[data-sid="${it.dataset.sid}"] .grip`);if(ng)ng.focus()});
function applySort(group,id,box,idx){
  if(group==='blocks'){const t=trById(R.id);if(!t)return;const from=t.blocks.findIndex(b=>b.id===id);if(from<0)return;const [b]=t.blocks.splice(from,1);t.blocks.splice(idx,0,b)}
  else if(group==='pj'){const dm=S.projet.domains.find(x=>x.id===UI.dom);if(!dm)return;const from=dm.items.findIndex(x=>x.id===id);if(from<0)return;const [it]=dm.items.splice(from,1);it.level=+box.dataset.l;
    const same=dm.items.filter(x=>x.level===it.level);if(idx<same.length)dm.items.splice(dm.items.indexOf(same[idx]),0,it);else if(same.length)dm.items.splice(dm.items.indexOf(same[same.length-1])+1,0,it);else dm.items.push(it)}
  save();render();
}

let sheetClose=null;
function openSheet(html,onClose){closeSheet(true);const o=document.createElement('div');o.className='ovl';o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;o.addEventListener('click',e=>{if(e.target===o)closeSheet()});document.body.appendChild(o);sheetClose=onClose||null;const f=o.querySelector('input:not([type=checkbox]),textarea');if(f&&f.dataset.focus)f.focus()}

function askConfirm(msg,yesLabel,onYes){openSheet(`<p style="margin:0;font-size:15px">${msg}</p><div class="grid2"><button type="button" class="btn wide bn" data-a="close">Annuler</button><button type="button" class="btn wide bd" data-a="confirmYes">${yesLabel}</button></div>`);CONFIRM=onYes}
let CONFIRM=null;
function sheetCreate(){openSheet(`<h2 class="h2">Créer</h2>
  <button type="button" class="opt" style="background:var(--hero)" data-a="newCycle">${I.cal}<span>Un cycle<small>5 à 7 semaines autour d'un objectif</small></span></button>
  <button type="button" class="opt" style="background:var(--cy-c)" data-a="newTr">${I.doc}<span>Une séance<small>Dans un cycle ou hors cycle</small></span></button>
  <button type="button" class="opt" style="background:var(--go-c)" data-a="newEx">${I.lib}<span>Un exercice<small>Il part directement dans la bibliothèque</small></span></button>

function sheetTr(t){
  const cys=S.cycles.slice().sort((a,b)=>(b.start||'').localeCompare(a.start||''));
  openSheet(`<h2 class="h2">Infos de la séance</h2>
  <label class="fld"><span class="flab">Titre</span><input data-f="trS.title" value="${esc(t.title)}" placeholder="Ex. Courir après la récupération" data-focus="1"></label>
  <label class="fld"><span class="flab">Petit commentaire</span><textarea data-f="trS.comment">${esc(t.comment)}</textarea></label>
  <div class="f3"><label class="fld"><span class="flab">Date</span><input type="date" data-f="trS.date" value="${esc(t.date)}"></label><label class="fld"><span class="flab">Joueurs</span><input inputmode="numeric" data-f="trS.players" value="${esc(t.players)}"></label><label class="fld"><span class="flab">Paniers</span><input inputmode="numeric" data-f="trS.baskets" value="${esc(t.baskets)}"></label></div>
  <label class="fld"><span class="flab">Cycle</span><select data-f="trS.cycleId"><option value="">Hors cycle</option>${cys.map(c=>`<option value="${c.id}" ${c.id===t.cycleId?'selected':''}>${esc(c.title)}</option>`).join('')}</select></label>
  <div class="fld"><span class="flab">Tags de la séance</span><div class="chips">${TAGS.filter(x=>x[0]!=='echauffement'&&x[0]!=='atelier').map(x=>x[0]).concat(S.trTags.map(n=>'c:'+n)).map(k=>{const on=(t.tags||[]).includes(k);return `<button type="button" class="chip ${on?'t-'+tagCol(k)+' sel':'off'}" data-a="tagTr" data-k="${esc(k)}" aria-pressed="${on}">${esc(tagName(k))}</button>`}).join('')}<button type="button" class="chip bdash" data-a="newTrTag">+ Créer un tag</button></div></div>
  <button type="button" class="btn wide bp" data-a="close">Terminé</button>`);
  SHEET_TR=t.id;
}
let SHEET_TR=null,SHEET_CY=null;
function sheetCy(c){
  openSheet(`<h2 class="h2">Infos du cycle</h2>
  <div class="fld"><span class="flab">Couleur du cycle</span><div class="chips" role="group" aria-label="Couleur du cycle">${CYCOL.map(x=>{const other=S.cycles.find(o=>o!==c&&o.color===x[0]&&cycleStatus(o)!=='past');return `<button type="button" class="chip cyb ${c.color===x[0]?'sel':''}" style="--cc:${x[2]};${c.color===x[0]?'outline:2px solid #fff;outline-offset:2px':''}" data-a="cyColor" data-v="${x[0]}" aria-pressed="${c.color===x[0]}">${x[1]}${other?' · pris':''}</button>`}).join('')}</div></div>
  <label class="fld"><span class="flab">Titre</span><input data-f="cyS.title" value="${esc(c.title)}" placeholder="Ex. Contre-attaque et transition" data-focus="1"></label>
  <label class="fld"><span class="flab">Description et objectif</span><textarea data-f="cyS.description">${esc(c.description)}</textarea></label>
  <label class="fld"><span class="flab">Sous-objectifs (séparés par des virgules)</span><input data-f="cyS.goals" value="${esc(c.goals)}"></label>
  <div class="grid2"><label class="fld"><span class="flab">Début</span><input type="date" data-f="cyS.start" value="${esc(c.start)}"></label><label class="fld"><span class="flab">Fin</span><input type="date" data-f="cyS.end" value="${esc(c.end)}"></label></div>
  <label class="fld"><span class="flab">Jours de séance</span><input data-f="cyS.days" value="${esc(c.days)}" placeholder="Ex. mardi et jeudi"></label>
  <button type="button" class="btn wide bp" data-a="close">Terminé</button>
  <button type="button" class="btn wide bd" data-a="delCy">${I.trash} Supprimer le cycle</button>`);

}
let NEWEX_CEC=false;

  const tr=fromTr&&trById(R.id);NEWEX_CEC=!!(tr&&tr.cec);
  openSheet(`<h2 class="h2">Nouvel exercice</h2><form data-form="newEx" style="display:flex;flex-direction:column;gap:12px"><label class="fld"><span class="flab">Titre</span><input id="nex" data-live="nex" placeholder="Ex. 3 contre 2 continu" data-focus="1" autocomplete="off"></label>
  <div id="dup"></div>
  <label class="chk c-ec" style="border:1px solid var(--ec-b);color:var(--ec)" for="nexw"><span>C'est un échauffement</span><input type="checkbox" id="nexw" style="accent-color:var(--ec)"></label>
  <label class="chk c-go" style="border:1px solid var(--go-b);color:var(--go-f)" for="nexa"><span>C'est un atelier de CEC<br><span class="small" style="font-weight:400;color:#E8D9A8">Il aura le tag « Atelier CEC » dans la bibliothèque</span></span><input type="checkbox" id="nexa" ${NEWEX_CEC?'checked':''}></label>
  <button type="submit" class="btn wide bp">Créer l'exercice</button></form>`);

let NEWEX_TR=null;
let PK={q:'',tag:'all',ex:null,sel:[]};
function sheetPick(){const t=trById(R.id);PK={q:'',tag:t&&t.cec&&S.exercises.some(e=>(e.tags||[]).includes('atelier'))?'atelier':'all',ex:null,sel:[]};openSheet(pickHtml())}
function pickHtml(){
  if(PK.ex){const e=exById(PK.ex);return `<h2 class="h2">${esc(e.title)}</h2><p class="small mut" style="margin:0">Choisis ce que tu ajoutes à la séance.</p>
   <button type="button" class="opt ${PK.sel==='all'?'':''}" style="background:${PK.sel==='all'?'var(--cy-t);outline:2px solid var(--cy)':'var(--card)'}" data-a="pkAll"><span>Exercice complet<small>${e.versions.map(v=>v.name).join(' → ')} à la suite</small></span></button>
   ${e.versions.map(v=>{const on=PK.sel!=='all'&&PK.sel.includes(v.id);return `<button type="button" class="opt" style="background:${on?'var(--go-t);outline:2px solid var(--go)':'var(--card)'}" data-a="pkVer" data-id="${v.id}"><span>${esc(v.name)} seulement<small>${esc(v.change||(v.deroulement||'').slice(0,70))}</small></span></button>`}).join('')}
   <div class="grid2"><button type="button" class="btn wide bn" data-a="pkBack">Retour</button><button type="button" class="btn wide bp" data-a="pkAdd" ${PK.sel!=='all'&&!PK.sel.length?'disabled style="opacity:.5"':''}>Ajouter</button></div>`}
  return `<h2 class="h2">Depuis la bibliothèque</h2><label style="display:flex"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Rechercher</span><input id="pkq" data-live="pkq" type="search" placeholder="Rechercher" value="${esc(PK.q)}"></label>
  <div class="chips"><button type="button" class="chip ${PK.tag==='all'?'t-ne sel':'off'}" data-a="pkTag" data-k="all">Tous</button>${TAGS.map(t=>`<button type="button" class="chip t-${t[2]} ${PK.tag===t[0]?'sel':''}" data-a="pkTag" data-k="${t[0]}">${t[1]}</button>`).join('')}</div>
  <div id="pklist" style="display:flex;flex-direction:column;gap:8px">${pickList()}</div>`;
}
function pickList(){const q=norm(PK.q);const l=S.exercises.filter(e=>(PK.tag==='all'||(e.tags||[]).includes(PK.tag))&&(!q||norm(e.title).includes(q))).sort((a,b)=>a.title.localeCompare(b.title,'fr'));
  return l.map(e=>`<button type="button" class="row" data-a="pkEx" data-id="${e.id}"><span class="grow"><span class="t15">${esc(e.title)}</span><span class="chips">${(e.tags||[]).filter(k=>k!=='offensif'&&k!=='defensif').map(chip).join('')}</span><span class="small" style="color:var(--go-f)">${e.versions.length} version${e.versions.length>1?'s':''}${e.duration?' · '+esc(e.duration)+' min':''}</span></span>${I.chev}</button>`).join('')||'<div class="empty">Aucun exercice trouvé.</div>'}
function sheetPickMa(){openSheet(`<h2 class="h2">Match à thème</h2>${S.themes.map(th=>{const ms=S.matches.filter(m=>(m.themes||[]).includes(th));if(!ms.length)return '';return `<h3 class="sec k-${themeCol(th)==='bl'?'cy':themeCol(th)}">${esc(th)}</h3>`+ms.map(m=>`<button type="button" class="row c-ma" data-a="pkMa" data-id="${m.id}"><span class="grow"><span class="t15">${esc(m.title)}</span><span class="small" style="color:var(--go-f)">${esc(m.rule)}</span></span></button>`).join('')}).join('')||'<div class="empty">Aucun match dans la bibliothèque.</div>'}<button type="button" class="btn wide bp" data-a="newMa" data-tr="1">+ Créer un nouveau match</button>`)}
function sheetSettings(){openSheet(`<h2 class="h2">Réglages</h2>
  <label class="fld"><span class="flab">Ton prénom (accueil)</span><input data-f="set.coach" value="${esc(S.settings.coach)}" placeholder="coach"></label>
  <label class="chk c-go" style="border:1px solid var(--go-b);color:var(--go-f)" for="s13"><span>Afficher le 13 dans le logo</span><input type="checkbox" id="s13" data-f="set.show13" ${S.settings.show13?'checked':''}></label>
  <h3 class="sec k-cy">Sauvegarde</h3>
  <p class="small mut" style="margin:0">Tes données restent sur ce téléphone. Fais une sauvegarde de temps en temps, ou pour passer à un autre appareil.</p>
  <div class="grid2"><button type="button" class="btn wide bn" data-a="exportData">Sauvegarder</button><label class="btn wide bn" for="imp" style="cursor:pointer">Restaurer<input type="file" id="imp" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0"></label></div>
  <div id="expout"></div>
  <button type="button" class="btn wide bd" data-a="wipe">Tout effacer</button>
  ${onWeb()&&!isStandalone()?'<button type="button" class="btn wide bp" data-a="installHelp">Installer CoachCo sur ce téléphone</button>':''}
  <p class="small mut" style="margin:0;text-align:center">CoachCo · version 1</p>`)}

/* ---------- actions ---------- */
function newTraining(cy,d){const t={id:uid(),title:'',comment:'',date:d||'',cec:false,tags:[],players:'',baskets:'',cycleId:cy||null,blocks:[]};S.trainings.push(t);save();return t}
function addBlockToTr(t,b){t.blocks.push(b);save()}
const A={
  tab:d=>tab(d.v),back:()=>back(),
  install:()=>{if(!INSTALL_EVT)return;INSTALL_EVT.prompt();INSTALL_EVT.userChoice.then(()=>{INSTALL_EVT=null;render()}).catch(()=>{})},
  installLater:()=>{try{localStorage.setItem('coachco-install-later',today())}catch(e){}INSTALL_HELP=false;render()},
  installHelp:()=>{closeSheet(true);INSTALL_HELP=true;try{localStorage.removeItem('coachco-install-later')}catch(e){}tab('home')},
  create:()=>sheetCreate(),settings:()=>sheetSettings(),close:()=>closeSheet(),
  confirmYes:()=>{const f=CONFIRM;CONFIRM=null;closeSheet(true);if(f)f();render()},
  clearSample:()=>askConfirm('Supprimer tous les exemples ? Tes réglages sont gardés.','Supprimer',()=>{const st=S.settings;S=emptyState();S.settings=st;save();tab('home')}),
  wipe:()=>askConfirm('Effacer toutes tes données ? Cette action est définitive.','Tout effacer',()=>{S=emptyState();save();tab('home')}),
  newCycle:()=>{closeSheet(true);const s=monday(today());const c={id:uid(),title:'',description:'',start:s,end:addDays(s,41),days:'',goals:''};c.color=pickCyColor(c);S.cycles.push(c);save();go('cycle',{id:c.id});sheetCy(c)},
  openCy:d=>{closeSheet(true);go('cycle',{id:d.id})},
  editCy:()=>{const c=cyById(R.id);if(c)sheetCy(c)},
  cyColor:d=>{const c=cyById(SHEET_CY);if(!c)return;c.color=d.v;save();const sc=$('.sheet')&&$('.sheet').scrollTop;closeSheet(true);render();sheetCy(c);if(sc&&$('.sheet'))$('.sheet').scrollTop=sc},
  delCy:()=>{const id=SHEET_CY;askConfirm('Supprimer ce cycle ? Ses séances sont gardées, hors cycle.','Supprimer',()=>{S.cycles=S.cycles.filter(c=>c.id!==id);S.trainings.forEach(t=>{if(t.cycleId===id)t.cycleId=null});save();tab('cycles')})},
  cal:d=>{UI.cal=d.v==='1';render()},
  newTr:d=>{closeSheet(true);const t=newTraining(d.cy||null,d.d||'');go('seance',{id:t.id});sheetTr(t)},
  openTr:d=>{closeSheet(true);go('seance',{id:d.id})},
  editTr:()=>{const t=trById(R.id);if(t)sheetTr(t)},
  tagTr:(d,el)=>{const t=trById(SHEET_TR);if(!t)return;const i=t.tags.indexOf(d.k);i<0?t.tags.push(d.k):t.tags.splice(i,1);save();const on=i<0;el.className='chip '+(on?'t-'+tagCol(d.k)+' sel':'off');el.setAttribute('aria-pressed',on)},
  newTrTag:()=>{const tid=SHEET_TR;openSheet(`<h2 class="h2">Nouveau tag</h2><form data-form="trtag" data-tid="${tid}" style="display:flex;flex-direction:column;gap:12px"><label class="fld"><span class="flab">Nom du tag</span><input id="ntt" placeholder="Ex. Pré-collectif" data-focus="1" autocomplete="off"></label><button type="submit" class="btn wide bp">Créer et ajouter à la séance</button></form>`);SHEET_TR=tid},
  trMenu:()=>openSheet(`<h2 class="h2">Séance</h2><button type="button" class="opt" style="background:var(--card)" data-a="dupTr">Dupliquer la séance<small style="margin-left:auto"></small></button><button type="button" class="opt" style="background:var(--red-t);color:var(--red)" data-a="delTr">Supprimer la séance</button>`),
  dupTr:()=>{const t=trById(R.id);const c=clone(t);c.id=uid();c.title=(t.title||'Séance')+' (copie)';c.blocks.forEach(b=>b.id=uid());S.trainings.push(c);save();closeSheet(true);R={view:'seance',id:c.id};render(true)},
  reuseTr:d=>{const t=trById(d.id);const c=clone(t);c.id=uid();c.title=(t.title||'Séance')+' (modèle)';c.date='';c.cycleId=null;c.blocks.forEach(b=>b.id=uid());S.trainings.push(c);save();go('seance',{id:c.id});sheetTr(c)},
  delTr:()=>{const id=R.id;askConfirm('Supprimer cette séance ? Les exercices restent dans la bibliothèque.','Supprimer',()=>{S.trainings=S.trainings.filter(t=>t.id!==id);save();back()})},
  blkMv:d=>{const t=trById(R.id);const i=+d.i,j=i+(+d.d);[t.blocks[i],t.blocks[j]]=[t.blocks[j],t.blocks[i]];save();render()},
  blkDel:d=>{const t=trById(R.id);t.blocks.splice(+d.i,1);save();render()},
  openBlk:d=>{const t=trById(R.id);const b=t.blocks[+d.i];if(!b)return;if(b.kind==='match'){go('match',{id:b.ref,tid:t.id,bid:b.id})}else go('ex',{id:b.ref,tid:t.id,bid:b.id})},
  pdf:()=>printTr(trById(R.id)),
  pdfPj:()=>printProjet(),
  newEx:d=>{closeSheet(true);sheetNewEx(d.tr==='1'||R.view==='seance')},
  openEx:d=>go('ex',{id:d.id}),
  delEx:()=>{const e=exById(R.id);const u=usage(e.id);askConfirm(`Supprimer « ${esc(e.title)} » de la bibliothèque ?${u?` Il est utilisé dans ${u} séance${u>1?'s':''} et en sera retiré.`:''}`,'Supprimer',()=>{S.exercises=S.exercises.filter(x=>x.id!==e.id);S.trainings.forEach(t=>t.blocks=t.blocks.filter(b=>!(b.kind==='ex'&&b.ref===e.id&&!b.adapt)));save();back()})},
  tagEx:(d,el)=>{const C=edCtx();if(C.ro)return;const e=C.obj;e.tags=e.tags||[];const i=e.tags.indexOf(d.k);i<0?e.tags.push(d.k):e.tags.splice(i,1);save();const on=i<0;el.className='chip '+(on?'t-'+TAG[d.k][2]+' sel':'off');el.setAttribute('aria-pressed',on)},
  ver:d=>{R.vid=d.id;render()},
  addVer:()=>{const C=edCtx();const e=C.obj;const cur=e.versions.find(v=>v.id===R.vid)||e.versions[e.versions.length-1];const nv=clone(cur);nv.id=uid();nv.name='V'+(e.versions.length+1);nv.change='';e.versions.push(nv);if(C.blk&&C.blk.vers!=='all')C.blk.vers.push(nv.id);R.vid=nv.id;save();render()},
  delVer:()=>{const C=edCtx();const e=C.obj;const v=e.versions.find(x=>x.id===R.vid);askConfirm(`Supprimer la version ${esc(v.name)} ?`,'Supprimer',()=>{e.versions=e.versions.filter(x=>x.id!==v.id);e.versions.forEach((x,i)=>x.name='V'+(i+1));S.trainings.forEach(t=>t.blocks.forEach(b=>{if(Array.isArray(b.vers)){b.vers=b.vers.filter(id=>id!==v.id);if(!b.vers.length)b.vers='all'}}));R.vid=null;save()})},
  adapt:()=>{const C=edCtx();C.blk.adapt=clone(exById(C.blk.ref));save();render()},
  unadapt:()=>askConfirm('Revenir à l\'exercice de la bibliothèque ? Les adaptations de cette séance seront perdues.','Revenir',()=>{const C=edCtx();C.blk.adapt=null;save()}),
  draw:()=>{const C=edCtx();if(C.ro)return;const v=C.obj.versions.find(x=>x.id===R.vid);openEditor(v.els&&v.els.length?v.els:null,els=>{v.els=els;save();render()})},
  bib:d=>{UI.bib=d.v;render()},ftag:d=>{UI.tag=d.k;render()},theme:d=>{UI.theme=d.v;render()},
  newTheme:d=>{const fromMa=d.ma==='1';openSheet(`<h2 class="h2">Nouveau thème</h2><form data-form="theme" data-ma="${fromMa?1:0}" style="display:flex;flex-direction:column;gap:12px"><label class="fld"><span class="flab">Nom du thème</span><input id="nth" placeholder="Ex. Démarquage" data-focus="1" autocomplete="off"></label><button type="submit" class="btn wide bp">Créer le thème</button></form>`)},
  newMa:d=>{closeSheet(true);const m={id:uid(),title:'',themes:UI.bib==='ma'&&UI.theme?[UI.theme]:[],rule:'',consignes:'',duration:'',els:null};S.matches.push(m);if(d.tr==='1'&&R.view==='seance'){const t=trById(R.id);const b={id:uid(),kind:'match',ref:m.id,vers:'all',adapt:null,duration:''};addBlockToTr(t,b);save();go('match',{id:m.id,tid:t.id,bid:b.id});return}save();go('match',{id:m.id})},

  delMa:()=>{const m=maById(R.id);askConfirm(`Supprimer le match « ${esc(m.title||'sans titre')} » ?`,'Supprimer',()=>{S.matches=S.matches.filter(x=>x.id!==m.id);S.trainings.forEach(t=>t.blocks=t.blocks.filter(b=>!(b.kind==='match'&&b.ref===m.id)));save();back()})},
  drawMa:()=>{const m=maById(R.id);openEditor(m.els&&m.els.length?m.els:null,els=>{m.els=els;save();render()})},
  noDrawMa:()=>{const m=maById(R.id);m.els=null;save();render()},
  pickEx:()=>sheetPick(),
  pkTag:d=>{PK.tag=d.k;setSheet(pickHtml())},
  pkEx:d=>{const e=exById(d.id);if(e.versions.length<2){addBlockToTr(trById(R.id),{id:uid(),kind:'ex',ref:e.id,vers:'all',adapt:null});closeSheet();return}PK.ex=e.id;PK.sel='all';setSheet(pickHtml())},
  pkAll:()=>{PK.sel='all';setSheet(pickHtml())},
  pkVer:d=>{if(PK.sel==='all')PK.sel=[];const i=PK.sel.indexOf(d.id);i<0?PK.sel.push(d.id):PK.sel.splice(i,1);setSheet(pickHtml())},
  pkBack:()=>{PK.ex=null;setSheet(pickHtml())},
  pkAdd:()=>{if(PK.sel!=='all'&&!PK.sel.length)return;const e=exById(PK.ex);const vers=PK.sel==='all'?'all':e.versions.filter(v=>PK.sel.includes(v.id)).map(v=>v.id);addBlockToTr(trById(R.id),{id:uid(),kind:'ex',ref:PK.ex,vers,adapt:null});closeSheet()},
  pickMa:()=>sheetPickMa(),
  pkMa:d=>{const m=maById(d.id);setSheet(`<h2 class="h2">${esc(m.title||'Match')}</h2><p class="small" style="margin:0;color:var(--go-f)">${esc(m.rule||'')}</p><form data-form="madur" data-id="${m.id}" style="display:flex;flex-direction:column;gap:12px"><label class="fld"><span class="flab">Durée du match dans cette séance (min)</span><input id="mdur" inputmode="numeric" value="${esc(m.duration||'')}" placeholder="Ex. 15" autocomplete="off"></label><p class="small mut" style="margin:0">Elle compte dans le temps total de la séance.</p><button type="submit" class="btn wide bp">Ajouter à la séance</button></form>`);const i=$('#mdur');if(i)i.focus()},
  dom:d=>{UI.dom=d.id;render()},

    s+=`<line x1="${el.x}" y1="${el.y}" x2="${hx}" y2="${hy}" stroke="${c}" stroke-width="${2*k}" pointer-events="none" opacity=".7"/><circle data-h="1" cx="${hx}" cy="${hy}" r="${30*k}" fill="transparent"/><circle cx="${hx}" cy="${hy}" r="${14*k}" fill="${c}" stroke="#052A31" stroke-width="${3*k}" pointer-events="none"/>`}
  return s;
}
function edDraw(){
  const order=t=>t==='terrain'||t==='demi'?0:t==='panier'||t==='plot'?1:isArrow(t)?2:3;
  const list=ED.els.slice().sort((a,b)=>order(a.type)-order(b.type));
  const sel=ED.sel&&ED.els.find(e=>e.id===ED.sel);
  let tmp='';if(ED.drag&&ED.drag.kind==='draw'&&ED.drag.pts.length>1)tmp=elSvg({id:'tmp',type:ED.tool,pts:ED.drag.pts},false);
  ED.svg.innerHTML=`<rect x="-3000" y="-3000" width="7000" height="6700" fill="url(#pq)"/>${list.map(e=>elSvg(e,true)).join('')}${tmp}${sel?selOverlay(sel):''}`;
  edSelBar();
}
function edDown(e){
  const svg=ED.svg;try{svg.setPointerCapture(e.pointerId)}catch(_){}
  ED.ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ED.ptrs.size===2){const [a,b]=[...ED.ptrs.values()];const r=svg.getBoundingClientRect();ED.pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,vb:Object.assign({},ED.vb),m:toSvgXY((a[0]+b[0])/2,(a[1]+b[1])/2),r};if(ED.drag&&ED.drag.pushed){ED.els=JSON.parse(ED.undo.pop())}ED.drag=null;edDraw();return}
  if(ED.ptrs.size>2)return;
  const p=toSvgXY(e.clientX,e.clientY);const t=e.target;
  if(t.dataset&&t.dataset.h){ED.drag={kind:'rot',id:ED.sel,pushed:false};return}
  const g=t.closest&&t.closest('[data-id]');
  if(ED.tool==='gomme'){ED.drag={kind:'erase',pushed:false};eraseAt(e.clientX,e.clientY);return}
  if(ED.tool==='vue'||(ED.tool==='select'&&!g)){if(ED.tool==='select'&&ED.sel){ED.sel=null;edDraw()}ED.drag={kind:'pan',c:[e.clientX,e.clientY],vb0:Object.assign({},ED.vb)};return}
  if(ED.tool==='select'&&g){ED.sel=g.dataset.id;ED.drag={kind:'move',id:g.dataset.id,last:p,pushed:false};edDraw();return}
  if(isArrow(ED.tool)){ED.drag={kind:'draw',pts:[[Math.round(p[0]),Math.round(p[1])]]};return}
  ED.drag={kind:'place',p,c:[e.clientX,e.clientY]};
}
function edMove(e){
  if(!ED.ptrs.has(e.pointerId))return;
  ED.ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ED.pinch&&ED.ptrs.size===2){const [a,b]=[...ED.ptrs.values()];const P=ED.pinch;const d=Math.hypot(a[0]-b[0],a[1]-b[1])||1;let w=Math.min(4000,Math.max(160,P.vb.w*P.d/d));const h=w*P.vb.h/P.vb.w;const mx=((a[0]+b[0])/2-P.r.left)/P.r.width,my=((a[1]+b[1])/2-P.r.top)/P.r.height;ED.vb={x:P.m[0]-mx*w,y:P.m[1]-my*h,w,h};setVB();return}
  const D=ED.drag;if(!D)return;
  if(D.kind==='erase'){eraseAt(e.clientX,e.clientY);return}
  if(D.kind==='pan'){const r=ED.svg.getBoundingClientRect();ED.vb.x=D.vb0.x-(e.clientX-D.c[0])/r.width*D.vb0.w;ED.vb.y=D.vb0.y-(e.clientY-D.c[1])/r.height*D.vb0.h;setVB();return}
  const p=toSvgXY(e.clientX,e.clientY);
  if(D.kind==='move'){const el=ED.els.find(x=>x.id===D.id);if(!el)return;const dx=p[0]-D.last[0],dy=p[1]-D.last[1];if(!D.pushed){if(Math.hypot(dx,dy)<2)return;pushUndo();D.pushed=true}
    if(isArrow(el.type))el.pts=el.pts.map(q=>[q[0]+dx,q[1]+dy]);else{el.x+=dx;el.y+=dy}D.last=p;edDraw();return}
  if(D.kind==='rot'){const el=ED.els.find(x=>x.id===D.id);if(!el)return;if(!D.pushed){pushUndo();D.pushed=true}let a=Math.atan2(p[0]-el.x,-(p[1]-el.y))*180/Math.PI;if(el.type==='terrain'||el.type==='demi'){const s=Math.round(a/90)*90;if(Math.abs(a-s)<6)a=s}el.rot=Math.round(a);edDraw();return}
  if(D.kind==='draw'){const l=D.pts[D.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>=6){D.pts.push([Math.round(p[0]),Math.round(p[1])]);edDraw()}}
}
function edUp(e){
  ED&&ED.ptrs.delete(e.pointerId);if(!ED)return;
  if(ED.pinch){if(ED.ptrs.size<2)ED.pinch=null;ED.drag=null;return}
  const D=ED.drag;ED.drag=null;if(!D)return;
  if(D.kind==='place'){if(Math.hypot(e.clientX-D.c[0],e.clientY-D.c[1])<14){pushUndo();const el={id:uid(),type:ED.tool,x:Math.round(D.p[0]),y:Math.round(D.p[1]),rot:ED.tool==='def'?180:0,s:PLACE_S[ED.tool]||1};ED.els.push(el);ED.sel=el.id;edTools()}edDraw();return}
  if(D.kind==='draw'){let len=0;for(let i=1;i<D.pts.length;i++)len+=Math.hypot(D.pts[i][0]-D.pts[i-1][0],D.pts[i][1]-D.pts[i-1][1]);
    if(D.pts.length>=2&&len>24){pushUndo();const pts=resample(D.pts,ED.tool==='main'?5:10).map(q=>[Math.round(q[0]),Math.round(q[1])]);ED.els.push({id:uid(),type:ED.tool,pts});edTools()}edDraw();return}
  if(D.kind==='move'||D.kind==='rot'||D.kind==='erase'){if(D.pushed)edTools();edDraw()}
}
function edClick(e){
  const b=e.target.closest('[data-e]');if(!b||b.disabled)return;const k=b.dataset.e;const el=ED.sel&&ED.els.find(x=>x.id===ED.sel);
  if(k==='cancel'||k==='save'){const pushed=ED.pushed;closeEditor(k==='save');if(pushed){IGNORE_POP=true;try{history.back()}catch(_){IGNORE_POP=false}}}
  else if(k==='tool'){ED.tool=b.dataset.t;ED.gym=false;if(ED.tool!=='select')ED.sel=null;edTools();edDraw()}
  else if(k==='undo'){if(ED.undo.length){ED.els=JSON.parse(ED.undo.pop());ED.sel=null;edTools();edDraw()}}
  else if(k==='zin')zoomAt([ED.vb.x+ED.vb.w/2,ED.vb.y+ED.vb.h/2],0.8);
  else if(k==='zout')zoomAt([ED.vb.x+ED.vb.w/2,ED.vb.y+ED.vb.h/2],1.25);
  else if(k==='zfit'){fitVB()}
  else if(k==='del'&&el){pushUndo();ED.els=ED.els.filter(x=>x!==el);ED.sel=null;edTools();edDraw()}
  else if(k==='dup'&&el){pushUndo();const c=clone(el);c.id=uid();if(isArrow(c.type))c.pts=c.pts.map(q=>[q[0]+30,q[1]+30]);else{c.x+=30;c.y+=30}ED.els.push(c);ED.sel=c.id;edTools();edDraw()}
  else if((k==='bigger'||k==='smaller')&&el){pushUndo();el.s=Math.max(.3,Math.min(4,(el.s||1)*(k==='bigger'?1.12:0.89)));edTools();edDraw()}
  else if(k==='gym'){ED.gym=!ED.gym;ED.sel=null;edDraw()}
  else if(k==='gymClose'){ED.gym=false;edDraw()}
  else if(k==='gymSave'){S.settings.gym=clone(ED.els.filter(x=>['terrain','demi','panier','plot'].includes(x.type)));save();$('#edsel').innerHTML='<span style="color:var(--go-f)">Ton gymnase est enregistré : il servira de fond à chaque nouveau schéma.</span><button type="button" class="btn sm bn" data-e="gymClose">OK</button>'}
  else if(k==='gymLoad'){pushUndo();ED.els=ED.els.filter(x=>!['terrain','demi','panier'].includes(x.type)).concat(clone(S.settings.gym).map(x=>(x.id=uid(),x)));ED.gym=false;edTools();edDraw()}
  else if(k==='clearAll'){pushUndo();ED.els=[];ED.sel=null;ED.gym=false;edTools();edDraw()}
}
document.addEventListener('keydown',e=>{if(ED&&(e.key==='z'||e.key==='Z')&&(e.ctrlKey||e.metaKey)){e.preventDefault();if(ED.undo.length){ED.els=JSON.parse(ED.undo.pop());ED.sel=null;edTools();edDraw()}}});

render(true);
if('serviceWorker' in navigator&&onWeb()){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
})();
